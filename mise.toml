min_version = "2026.8.3"

[[hooks.enter]]
shell = "bash"
script = '''
if command -v kinko >/dev/null 2>&1 && kinko hook --help >/dev/null 2>&1; then
  eval "$(kinko --path "$MISE_PROJECT_ROOT" hook enter bash)"
fi
'''

[[hooks.leave]]
shell = "bash"
script = '''
if command -v kinko >/dev/null 2>&1 && kinko hook --help >/dev/null 2>&1; then
  eval "$(kinko hook leave bash)"
fi
'''

[tools]
bun = "latest"
biome = "latest"
node = "lts"
gitleaks = "latest"
pre-commit = "latest"
# Pinned to the same version apps/api declares, so `mise exec -- wrangler`
# and `bun run --cwd apps/api cf:deploy` can never drift onto different
# Workers runtimes. Provided here as well as in package.json so deploying
# does not depend on a global install that a fresh checkout would not have.
"npm:wrangler" = "4.123.0"

[tasks.default]
description = "Show available tasks"
run = "mise tasks ls"

[tasks.install]
description = "Install dependencies"
run = "bun install"

[tasks.dev]
description = "Run the API and web dev servers concurrently"
run = "bun run --cwd apps/api dev & bun run --cwd apps/web dev & wait"

[tasks.dev-api]
description = "Run the local API server (Bun) with a file SQLite database"
run = "bun run --cwd apps/api dev"

[tasks.dev-web]
description = "Run the SolidJS web dev server (vite)"
run = "bun run --cwd apps/web dev"

[tasks.build]
description = "Build the project"
run = "bun run build"

[tasks.build-web]
description = "Build the web mail client (vite build -> apps/web/dist)"
run = "bun run --cwd apps/web build"

[tasks.build-api-node]
description = "Build the API server as a Node-runnable bundle"
run = "bun run --cwd apps/api build:node"

[tasks.start]
description = "Run the local API server"
run = "bun run --cwd apps/api start"

[tasks.client-serve]
description = "Serve the browser mail client via the mailcal CLI"
run = "bun run --cwd apps/cli start -- client serve"

[tasks.cf-dev]
description = "Run wrangler dev (Workers runtime with local D1/R2 simulators)"
run = "bun run --cwd apps/api cf:dev"

[tasks.cf-deploy]
description = "Build the web client, apply remote migrations, and deploy"
depends = ["build-web"]
run = [
  "bun run --cwd apps/api migrate:remote",
  "bun run --cwd apps/api cf:deploy",
]

[tasks.test]
description = "Run tests with Vitest"
run = "bun run test"

[tasks.test-watch]
description = "Run tests in watch mode with Vitest"
run = "bun run test:watch"

[tasks.test-verbose]
description = "Run tests with verbose output"
run = "bun run test -- --reporter=verbose"

[tasks.test-ui]
description = "Run tests with the Vitest UI"
run = "bun run test:ui"

[tasks.typecheck]
description = "Run TypeScript type checking"
run = "bun run typecheck"

[tasks.fmt]
description = "Format code with Biome"
run = "bun run format"

[tasks.fmt-check]
description = "Check code formatting"
run = "bun run format:check"

[tasks.lint]
description = "Run all lints"
run = "bun run lint:biome && mise run fmt-check && mise run typecheck"

[tasks.clean]
description = "Clean build artifacts"
run = "bun run clean"

[tasks.ci]
description = "Run all CI checks"
run = "mise run lint && mise run test && mise run build"

[tasks.install-git-hooks]
description = "Install mise tools and the repository pre-commit hook"
run = '''
mise install

hooks_path=$(git config --local --get core.hooksPath || true)
if [ "$hooks_path" = ".git/hooks" ]; then
  git config --local --unset-all core.hooksPath
  hooks_path=""
fi

if [ -z "$hooks_path" ]; then
  mise exec -- pre-commit install
else
  mise exec -- pre-commit validate-config .pre-commit-config.yaml
  echo "Using existing custom Git hooks path: $hooks_path"
fi
'''
